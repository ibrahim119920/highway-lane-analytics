# Intelligent Highway Lane Occupancy & Hogging Detection
# Camera profile: Tj. Priok toll road, KM 58+400 (B), night, 1024x768 @ 18 fps.
# Coordinates are normalized (0.0 - 1.0) so the profile is resolution independent.
#
# The camera sits on the median, so both carriageways are mapped, three lanes each:
#   nb_lane_1/2/3 = northbound (left carriageway, traffic receding)
#   sb_lane_1/2/3 = southbound (right carriageway, traffic approaching)
# lane_3 is the median-side lane in both directions and carries the `overtaking` role.

camera_id: tj_priok_km58_400b
base_timestamp: "2026-11-07T23:15:38"   # CCTV overlay time at frame 0; "" = run start

model:
  weights: yolo11n.pt          # pretrained Ultralytics checkpoint (auto-downloaded)
  device: cpu                  # "cpu" or "0" for the first CUDA GPU (Colab)
  imgsz: 960                   # near-native for 1024x768; drop to 640 for slower CPUs
  conf: 0.30                   # night footage: low-light vehicles score lower
  iou: 0.50                    # NMS IoU threshold
  tracker: bytetrack.yaml      # ships with Ultralytics
  classes: [2, 5, 7]           # COCO: car, bus, truck (motorcycles excluded)

video:
  path: data/raw/km58_400B_tj_priok_20261107_161545.mp4
  # 1 = detect on every frame. The source is only ~18 fps, and skipping frames
  # makes ByteTrack fail to confirm fast near-field vehicles: an unconfirmed
  # track is matched against its last position, so a stride of 2 can drop the
  # IoU below the tracker's 0.3 threshold and delay the first box by ~0.7 s.
  # Raise to 2 only for throughput-first batch runs where that latency is fine.
  frame_stride: 1
  max_frames: null             # optional cap on source frames read
  output_fps: null             # null = source_fps / frame_stride

# Lane polygons supplied for this camera, in the CCTV point of view.
# Coordinates were drawn on a 1434x1076 capture and normalized by that size; the
# aspect ratio matches the 1024x768 video, so the same polygons apply.
#
# Northbound = left carriageway (traffic receding). Southbound = right carriageway
# (traffic approaching). lane_3 is the median-side lane in both directions, so it
# carries the `overtaking` role used by the hogging rules.
# The bottom-left and bottom-right corner triangles between lane1_2 and lane2_3 are
# included in lane 2, per the calibration notes.
lanes:
  - name: nb_lane_1
    index: 1
    direction: northbound
    role: normal
    polygon: [[0.00000, 0.76580], [0.15760, 0.61896], [0.26709, 0.51766],
              [0.35983, 0.43587], [0.43305, 0.37175], [0.45119, 0.37175],
              [0.39470, 0.43773], [0.32845, 0.51580], [0.26290, 0.59387],
              [0.15411, 0.72491], [0.00000, 0.92565]]

  - name: nb_lane_2
    index: 2
    direction: northbound
    role: normal
    polygon: [[0.00000, 0.92565], [0.00000, 1.00000], [0.13738, 1.00000],
              [0.27406, 0.73141], [0.35704, 0.57063], [0.40028, 0.49349],
              [0.42957, 0.44145], [0.46792, 0.37175], [0.45119, 0.37175],
              [0.39470, 0.43773], [0.32845, 0.51580], [0.26290, 0.59387],
              [0.15411, 0.72491]]

  - name: nb_lane_3
    index: 3
    direction: northbound
    role: overtaking
    polygon: [[0.13738, 1.00000], [0.27406, 0.73141], [0.35704, 0.57063],
              [0.40028, 0.49349], [0.42957, 0.44145], [0.46792, 0.37175],
              [0.48605, 0.37175], [0.47490, 0.43494], [0.46304, 0.48420],
              [0.44770, 0.56041], [0.42469, 0.68866], [0.37308, 1.00000]]

  - name: sb_lane_1
    index: 1
    direction: southbound
    role: normal
    polygon: [[1.00000, 0.68587], [0.77336, 0.51952], [0.72385, 0.48513],
              [0.68550, 0.45911], [0.62762, 0.41729], [0.55997, 0.37175],
              [0.53975, 0.37175], [0.60948, 0.44145], [0.69944, 0.52695],
              [0.78452, 0.61059], [0.88633, 0.71561], [1.00000, 0.82900]]

  - name: sb_lane_2
    index: 2
    direction: southbound
    role: normal
    polygon: [[1.00000, 0.82900], [1.00000, 1.00000], [0.92678, 1.00000],
              [0.77127, 0.75743], [0.68061, 0.61710], [0.61367, 0.51394],
              [0.55858, 0.43401], [0.51813, 0.37175], [0.53975, 0.37175],
              [0.60948, 0.44145], [0.69944, 0.52695], [0.78452, 0.61059],
              [0.88633, 0.71561]]

  - name: sb_lane_3
    index: 3
    direction: southbound
    role: overtaking
    polygon: [[0.92678, 1.00000], [0.77127, 0.75743], [0.68061, 0.61710],
              [0.61367, 0.51394], [0.55858, 0.43401], [0.51813, 0.37175],
              [0.49861, 0.37175], [0.51325, 0.43866], [0.52999, 0.50558],
              [0.55997, 0.63197], [0.59414, 0.77045], [0.64644, 1.00000]]

occupancy:
  anchor: bottom_center        # fallback point for small/unclassified boxes
  # Use the full bottom edge of the bounding box for the lane decision: wide
  # near-field boxes are sampled at several points and the majority lane wins.
  assignment: bbox_vote
  bbox_vote_samples: 5
  bbox_vote_min_share: 0.5
  restrict_to_direction: true
  anchor_shift_enabled: true   # wide near-field boxes slide to the outer bottom corner
  anchor_shift_small_bbox_px: 90    # no shift at or below this box width
  anchor_shift_large_bbox_px: 250   # full shift to the corner at or above this width
  direction_deadband_px: 2.0        # vertical motion needed to count as a direction vote
  direction_min_votes: 2            # consistent votes before the direction is locked
  min_confidence: 0.30
  min_lane_frames: 3           # ~0.22-0.33 s of evidence before a lane switch commits
  max_track_age_frames: 36     # ~2 s at 18 fps: retire a track once it is gone
  emit_lane_enter: true
  emit_lane_exit: true
  emit_lane_change: true

# IMPORTANT - dwell windows for this camera.
# The calibrated zone covers a few tens of metres per direction, so "dwell" means
# "time observed inside the zone", not a long-horizon occupancy measurement.
#
# The manual labels (data/labels/lane_hogging_10m.csv, 56 reviewed vehicles) show
# that dwell alone does not separate hogging from legitimate overtaking:
# reviewed hoggers were observed for 0.7-8.6 s in lane 2/3, and overtaking
# vehicles for 1.1-5.3 s. The separating signal is *context*: a vehicle that is
# passing a slower vehicle in the adjacent inner lane is not a hogger.
#   - `overtake_exemption` compares the ego bottom point with the bottom point of
#     every vehicle in lane index-1 (ahead within a gap, slower by a margin).
#   - Dwell stays low (0.4 s) so heavy vehicles that cross the zone quickly are
#     still caught; the overtake context suppresses the false positives.
hogging:
  enabled: true
  retrigger_after_seconds: 0   # 0 = one indication per (track, lane stint, rule)
  evaluate_at: stint           # decide when the lane stint ends (whole pass visible)
  overtake_exemption: true
  overtake_gap_fraction: 0.10  # max longitudinal gap, fraction of frame height
  overtake_gap_back_fraction: 0.25  # accept a just-passed vehicle slightly behind
  overtake_speed_margin_px_s: 1.0
  overtake_confirm_seconds: 0.0
  overtake_stint_memory: true  # a confirmed pass exempts the whole lane stint
  rules:
    # Trucks/buses belong in lane 1; lane 2/3 cruising is an indication unless
    # they are actively passing a slower lane-1/lane-2 vehicle.
    - name: heavy_cruising_lane_2_3
      lane_indices: [2, 3]
      classes: [truck, bus]
      min_dwell_seconds: 0.4
      exempt_when_overtaking: true
      severity: high
      description: "Truk/bus cruising di lajur 2/3 tanpa sedang mendahului."

    # A car that stays in lane 2/3 without an overtake target.
    - name: car_cruising_lane_2_3
      lane_indices: [2, 3]
      classes: [car]
      min_dwell_seconds: 0.4
      exempt_when_overtaking: true
      severity: medium
      description: "Mobil cruising di lajur 2/3 tanpa sedang mendahului."

analytics:
  interval_seconds: 60         # time bucket for event timeseries

# Snapshot + short-clip evidence for lane events. Generated automatically after a run.
# Each event points to a JPEG snapshot and an 8-second MP4 clip centred on the event.
evidence:
  enabled: true
  event_types: []          # [] = all events; e.g. [lane_change, lane_hogging_indication]
  before_seconds: 4.0
  after_seconds: 4.0       # 4 + 4 = 8-second clip
  snapshot_format: jpg
  snapshot_quality: 92
  clip_codec: libx264
  clip_preset: veryfast
  clip_crf: 23
  max_clips: null          # optional cap on unique clips per run
  output_dir: null         # null = output/evidence/<run_id>

output:
  dir: output
  video: null                  # null = output/videos/<run_id>_annotated.mp4
  events: null                 # null = output/events/<run_id>.jsonl
  tracks: null                 # null = output/tracks/<run_id>.jsonl
  reports_dir: null            # null = output/reports/<run_id>
